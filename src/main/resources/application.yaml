spring:
  application:
    name: court-manager-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/courtmanager
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

courtmanager:
  booking:
    slot-duration-minutes: 60